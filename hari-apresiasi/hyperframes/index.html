<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=720, height=1280" />
    <script src="./vendor/gsap.min.js"></script>
    <script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 720px; height: 1280px; overflow: hidden; background: #e4dbd0; }
      #root { position: relative; width: 720px; height: 1280px; }
      #stage { position: absolute; inset: 0; width: 720px; height: 1280px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="720" data-height="1280">
      <canvas id="stage" class="clip" width="720" height="1280" data-start="0" data-duration="30" data-track-index="0"></canvas>
    </div>
    <script>
      // GSAP memandu masa (0..30s); setiap seek memanggil scene.renderAt(t) (Three.js).
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const state = { t: 0 };
      let scene = null;
      tl.to(state, { t: 30, duration: 30, ease: 'none', onUpdate: () => scene && scene.renderAt(state.t) }, 0);
      window.__timelines['main'] = tl;
      window.__hfScene = import('./src/scene.js').then((m) => m.createScene({ canvas: document.getElementById('stage'), assetBase: './assets' }))
        .then((s) => { scene = s; scene.renderAt(state.t); return s; });
    </script>
  </body>
</html>
